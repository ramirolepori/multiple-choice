<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="18" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Formato del datagrama IPv4</text>

  <!-- regla de bits -->
  <g font-size="11" fill="#64748b">
    <text x="80" y="60">0</text>
    <text x="248" y="60" text-anchor="middle">8</text>
    <text x="440" y="60" text-anchor="middle">16</text>
    <text x="632" y="60" text-anchor="middle">24</text>
    <text x="820" y="60" text-anchor="end">31</text>
  </g>
  <line x1="80" y1="66" x2="820" y2="66" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- palabra 1 -->
  <g>
    <rect x="80" y="74" width="92" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="126" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Versión</text>
    <text x="126" y="111" text-anchor="middle" font-size="10" fill="#1e40af">4 bits</text>

    <rect x="172" y="74" width="92" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="218" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">IHL</text>
    <text x="218" y="111" text-anchor="middle" font-size="10" fill="#1e40af">4 bits</text>

    <rect x="264" y="74" width="186" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="357" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Servicios Diferenciados</text>
    <text x="357" y="111" text-anchor="middle" font-size="10" fill="#1e40af">8 bits (ToS / ECN)</text>

    <rect x="450" y="74" width="370" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="635" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Longitud total del datagrama</text>
    <text x="635" y="111" text-anchor="middle" font-size="10" fill="#1e40af">16 bits</text>
  </g>

  <!-- palabra 2 -->
  <g>
    <rect x="80" y="120" width="370" height="46" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
    <text x="265" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Identificación</text>
    <text x="265" y="157" text-anchor="middle" font-size="10" fill="#854d0e">16 bits</text>

    <rect x="450" y="120" width="80" height="46" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
    <text x="490" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Flags</text>
    <text x="490" y="157" text-anchor="middle" font-size="10" fill="#854d0e">DF / MF</text>

    <rect x="530" y="120" width="290" height="46" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
    <text x="675" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Desplazamiento del fragmento</text>
    <text x="675" y="157" text-anchor="middle" font-size="10" fill="#854d0e">13 bits</text>
  </g>

  <!-- palabra 3 -->
  <g>
    <rect x="80" y="166" width="184" height="46" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
    <text x="172" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">TTL</text>
    <text x="172" y="203" text-anchor="middle" font-size="10" fill="#166534">8 bits · cantidad de saltos</text>

    <rect x="264" y="166" width="186" height="46" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
    <text x="357" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Protocolo</text>
    <text x="357" y="203" text-anchor="middle" font-size="10" fill="#166534">TCP / UDP / ICMP</text>

    <rect x="450" y="166" width="370" height="46" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
    <text x="635" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Suma de verificación de la cabecera</text>
    <text x="635" y="203" text-anchor="middle" font-size="10" fill="#166534">16 bits · sólo cubre la cabecera</text>
  </g>

  <!-- palabra 4 y 5 -->
  <rect x="80" y="212" width="740" height="42" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="450" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Dirección IP de origen (32 bits)</text>

  <rect x="80" y="254" width="740" height="42" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="450" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">Dirección IP de destino (32 bits)</text>

  <!-- palabra 6 -->
  <rect x="80" y="296" width="600" height="42" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="380" y="322" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Opciones (longitud variable)</text>
  <rect x="680" y="296" width="140" height="42" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="750" y="322" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Relleno</text>

  <!-- datos -->
  <rect x="80" y="338" width="740" height="46" fill="#f1f5f9" stroke="#475569" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="450" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DATOS (segmento de la capa de transporte)</text>

  <text x="450" y="424" text-anchor="middle" font-size="12" fill="#475569">Cada fila representa una palabra de 32 bits. La cabecera mínima ocupa 5 palabras = 20 bytes (IHL = 5).</text>
</svg>
