<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <symbol id="rt" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="0 0 88 74">
      <rect x="5" y="5" width="78" height="52" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
      <rect x="13" y="13" width="62" height="36" rx="3" fill="#64748b"/>
      <path d="M35 57 h18 l4 9 h-26 z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="65" width="48" height="7" rx="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="18" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Vector distancia — red convergente</text>

  <!-- enlaces -->
  <g stroke="#334155" stroke-width="2.5">
    <line x1="100" y1="108" x2="164" y2="108"/>
    <line x1="240" y1="108" x2="462" y2="108"/>
    <line x1="538" y1="108" x2="760" y2="108"/>
    <line x1="836" y1="108" x2="900" y2="108"/>
  </g>

  <!-- etiquetas de enlace -->
  <g font-size="15" font-weight="700" fill="#0f172a">
    <rect x="306" y="86" width="90" height="20" rx="6" fill="#ffffff"/>
    <text x="351" y="102" text-anchor="middle">14.0.0.0</text>
    <rect x="604" y="86" width="90" height="20" rx="6" fill="#ffffff"/>
    <text x="649" y="102" text-anchor="middle">16.0.0.0</text>
  </g>
  <g font-size="12.5" fill="#475569">
    <text x="248" y="126">S0</text>
    <text x="454" y="126" text-anchor="end">S1</text>
    <text x="546" y="126">S2</text>
    <text x="752" y="126" text-anchor="end">S3</text>
    <text x="156" y="126" text-anchor="end">F0</text>
    <text x="844" y="126">F0</text>
  </g>

  <!-- LANs (PCs) -->
  <use href="#pc" x="44" y="85" width="56" height="47"/>
  <text x="72" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">LAN 12.0.0.0</text>
  <use href="#pc" x="900" y="85" width="56" height="47"/>
  <text x="928" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">LAN 18.0.0.0</text>

  <!-- routers -->
  <use href="#rt" x="164" y="88" width="76" height="41"/>
  <text x="202" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">RA</text>
  <use href="#rt" x="462" y="88" width="76" height="41"/>
  <text x="500" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">RB</text>
  <use href="#rt" x="760" y="88" width="76" height="41"/>
  <text x="798" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">RC</text>

  <!-- Tabla A -->
  <g>
    <rect x="40" y="180" width="286" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="183" y="204" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Tabla del Router A</text>
    <line x1="40" y1="214" x2="326" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="13" fill="#475569" font-weight="700">
      <text x="60" y="234">Red</text><text x="196" y="234">Métrica</text><text x="272" y="234">Interfaz</text>
    </g>
    <g font-size="13.5" fill="#0f172a">
      <text x="60" y="262">12.0.0.0</text><text x="218" y="262">0</text><text x="288" y="262">F0</text>
      <text x="60" y="290">14.0.0.0</text><text x="218" y="290">0</text><text x="288" y="290">S0</text>
      <text x="60" y="318">16.0.0.0</text><text x="218" y="318">1</text><text x="288" y="318">S0</text>
      <text x="60" y="346">18.0.0.0</text><text x="218" y="346">2</text><text x="288" y="346">S0</text>
    </g>
  </g>

  <!-- Tabla B -->
  <g>
    <rect x="357" y="180" width="286" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="500" y="204" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Tabla del Router B</text>
    <line x1="357" y1="214" x2="643" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="13" fill="#475569" font-weight="700">
      <text x="377" y="234">Red</text><text x="513" y="234">Métrica</text><text x="589" y="234">Interfaz</text>
    </g>
    <g font-size="13.5" fill="#0f172a">
      <text x="377" y="262">14.0.0.0</text><text x="535" y="262">0</text><text x="605" y="262">S1</text>
      <text x="377" y="290">16.0.0.0</text><text x="535" y="290">0</text><text x="605" y="290">S2</text>
      <text x="377" y="318">12.0.0.0</text><text x="535" y="318">1</text><text x="605" y="318">S1</text>
      <text x="377" y="346">18.0.0.0</text><text x="535" y="346">1</text><text x="605" y="346">S2</text>
    </g>
  </g>

  <!-- Tabla C -->
  <g>
    <rect x="674" y="180" width="286" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="817" y="204" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Tabla del Router C</text>
    <line x1="674" y1="214" x2="960" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="13" fill="#475569" font-weight="700">
      <text x="694" y="234">Red</text><text x="830" y="234">Métrica</text><text x="906" y="234">Interfaz</text>
    </g>
    <g font-size="13.5" fill="#0f172a">
      <text x="694" y="262">16.0.0.0</text><text x="852" y="262">0</text><text x="922" y="262">S3</text>
      <text x="694" y="290">18.0.0.0</text><text x="852" y="290">0</text><text x="922" y="290">F0</text>
      <text x="694" y="318">14.0.0.0</text><text x="852" y="318">1</text><text x="922" y="318">S3</text>
      <text x="694" y="346">12.0.0.0</text><text x="852" y="346">2</text><text x="922" y="346">S3</text>
    </g>
  </g>

  <text x="500" y="420" text-anchor="middle" font-size="13.5" fill="#475569">La métrica indica la cantidad de saltos y el vector, la interfaz de salida hacia esa red.</text>
  <text x="500" y="446" text-anchor="middle" font-size="13" fill="#64748b">Cada router sólo conoce distancias informadas por sus vecinos: desconoce la topología completa.</text>
</svg>
