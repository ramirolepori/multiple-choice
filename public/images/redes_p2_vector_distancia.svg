<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="430" rx="18" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Vector distancia — red convergente</text>

  <!-- LANs -->
  <rect x="112" y="48" width="116" height="34" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="170" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">LAN 12.0.0.0</text>
  <rect x="672" y="48" width="116" height="34" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">LAN 18.0.0.0</text>

  <!-- enlaces -->
  <g stroke="#334155" stroke-width="2.5">
    <line x1="170" y1="82" x2="170" y2="118"/>
    <line x1="730" y1="82" x2="730" y2="118"/>
    <line x1="225" y1="145" x2="395" y2="145"/>
    <line x1="505" y1="145" x2="675" y2="145"/>
  </g>

  <!-- etiquetas de enlace -->
  <g font-size="11.5" fill="#0f172a">
    <rect x="252" y="124" width="116" height="18" rx="5" fill="#ffffff"/>
    <text x="310" y="138" text-anchor="middle" font-weight="700">14.0.0.0</text>
    <text x="232" y="163" font-size="10.5" fill="#475569">S0</text>
    <text x="388" y="163" font-size="10.5" fill="#475569" text-anchor="end">S1</text>

    <rect x="532" y="124" width="116" height="18" rx="5" fill="#ffffff"/>
    <text x="590" y="138" text-anchor="middle" font-weight="700">16.0.0.0</text>
    <text x="512" y="163" font-size="10.5" fill="#475569">S2</text>
    <text x="668" y="163" font-size="10.5" fill="#475569" text-anchor="end">S3</text>

    <text x="178" y="104" font-size="10.5" fill="#475569">F0</text>
    <text x="738" y="104" font-size="10.5" fill="#475569">F0</text>
  </g>

  <!-- routers -->
  <g>
    <rect x="115" y="118" width="110" height="54" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="170" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">RA</text>
    <rect x="395" y="118" width="110" height="54" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="450" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">RB</text>
    <rect x="675" y="118" width="110" height="54" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="730" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">RC</text>
  </g>

  <!-- Tabla A -->
  <g>
    <rect x="40" y="200" width="240" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="160" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Tabla del Router A</text>
    <line x1="40" y1="230" x2="280" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="11.5" fill="#475569" font-weight="700">
      <text x="56" y="248">Red</text><text x="176" y="248">Métrica</text><text x="238" y="248">Interfaz</text>
    </g>
    <g font-size="11.5" fill="#0f172a">
      <text x="56" y="272">12.0.0.0</text><text x="192" y="272">0</text><text x="248" y="272">F0</text>
      <text x="56" y="296">14.0.0.0</text><text x="192" y="296">0</text><text x="248" y="296">S0</text>
      <text x="56" y="320">16.0.0.0</text><text x="192" y="320">1</text><text x="248" y="320">S0</text>
      <text x="56" y="344">18.0.0.0</text><text x="192" y="344">2</text><text x="248" y="344">S0</text>
    </g>
  </g>

  <!-- Tabla B -->
  <g>
    <rect x="330" y="200" width="240" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="450" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Tabla del Router B</text>
    <line x1="330" y1="230" x2="570" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="11.5" fill="#475569" font-weight="700">
      <text x="346" y="248">Red</text><text x="466" y="248">Métrica</text><text x="528" y="248">Interfaz</text>
    </g>
    <g font-size="11.5" fill="#0f172a">
      <text x="346" y="272">14.0.0.0</text><text x="482" y="272">0</text><text x="538" y="272">S1</text>
      <text x="346" y="296">16.0.0.0</text><text x="482" y="296">0</text><text x="538" y="296">S2</text>
      <text x="346" y="320">12.0.0.0</text><text x="482" y="320">1</text><text x="538" y="320">S1</text>
      <text x="346" y="344">18.0.0.0</text><text x="482" y="344">1</text><text x="538" y="344">S2</text>
    </g>
  </g>

  <!-- Tabla C -->
  <g>
    <rect x="620" y="200" width="240" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="740" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Tabla del Router C</text>
    <line x1="620" y1="230" x2="860" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-size="11.5" fill="#475569" font-weight="700">
      <text x="636" y="248">Red</text><text x="756" y="248">Métrica</text><text x="818" y="248">Interfaz</text>
    </g>
    <g font-size="11.5" fill="#0f172a">
      <text x="636" y="272">16.0.0.0</text><text x="772" y="272">0</text><text x="828" y="272">S3</text>
      <text x="636" y="296">18.0.0.0</text><text x="772" y="296">0</text><text x="828" y="296">F0</text>
      <text x="636" y="320">14.0.0.0</text><text x="772" y="320">1</text><text x="828" y="320">S3</text>
      <text x="636" y="344">12.0.0.0</text><text x="772" y="344">2</text><text x="828" y="344">S3</text>
    </g>
  </g>

  <text x="450" y="404" text-anchor="middle" font-size="12" fill="#475569">La métrica indica la cantidad de saltos y el vector, la interfaz de salida hacia esa red.</text>
</svg>
