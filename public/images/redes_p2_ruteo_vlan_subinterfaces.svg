<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <symbol id="rt" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
    <symbol id="sw" viewBox="0 0 96 62">
      <path d="M6 28 L48 46 L90 28 L90 40 L48 58 L6 40 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M48 10 L90 28 L48 46 L6 28 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
      <g stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 24 H60"/><path d="M53 19 L60 24 L53 29"/>
        <path d="M64 33 H34"/><path d="M41 28 L34 33 L41 38"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="0 0 88 74">
      <rect x="5" y="5" width="78" height="52" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
      <rect x="13" y="13" width="62" height="36" rx="3" fill="#64748b"/>
      <path d="M35 57 h18 l4 9 h-26 z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="65" width="48" height="7" rx="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="490" rx="18" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Ruteo entre VLANs mediante subinterfaces</text>

  <!-- enlace troncal -->
  <line x1="500" y1="105" x2="500" y2="195" stroke="#b45309" stroke-width="4.5"/>
  <!-- enlaces de acceso -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="475" y1="245" x2="130" y2="370"/>
    <line x1="492" y1="247" x2="330" y2="370"/>
    <line x1="508" y1="247" x2="660" y2="370"/>
    <line x1="525" y1="245" x2="860" y2="370"/>
  </g>

  <!-- router -->
  <use href="#rt" x="462" y="64" width="76" height="41"/>
  <text x="450" y="80" text-anchor="end" font-size="16" font-weight="700" fill="#1e3a8a">Router</text>
  <text x="450" y="99" text-anchor="end" font-size="12.5" fill="#1e40af">una interfaz física</text>

  <!-- subinterfaces -->
  <rect x="566" y="46" width="252" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <g font-size="13.5" font-weight="700" fill="#1e3a8a">
    <text x="580" y="70">G0/0.100 — 10.100.0.1/24</text>
    <text x="580" y="93">G0/0.200 — 10.200.0.1/24</text>
    <text x="580" y="116">G0/0.300 — 10.300.0.1/24</text>
  </g>

  <!-- etiqueta troncal -->
  <g>
    <text x="514" y="146" font-size="14.5" font-weight="700" fill="#92400e">Enlace troncal (tagged)</text>
    <text x="514" y="165" font-size="12.5" fill="#b45309">transporta VLAN 100, 200 y 300</text>
  </g>

  <!-- switch -->
  <use href="#sw" x="460" y="195" width="80" height="52"/>
  <text x="448" y="216" text-anchor="end" font-size="16" font-weight="700" fill="#14532d">Switch</text>
  <text x="448" y="235" text-anchor="end" font-size="12.5" fill="#166534">con soporte de VLAN</text>

  <!-- nota puertos de acceso -->
  <rect x="398" y="316" width="204" height="24" rx="7" fill="#ffffff"/>
  <text x="500" y="333" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">Puertos de acceso (untagged)</text>

  <!-- PCs -->
  <use href="#pc" x="102" y="370" width="56" height="47"/>
  <use href="#pc" x="302" y="370" width="56" height="47"/>
  <use href="#pc" x="632" y="370" width="56" height="47"/>
  <use href="#pc" x="832" y="370" width="56" height="47"/>

  <g text-anchor="middle">
    <text x="130" y="437" font-size="15" font-weight="700" fill="#0f172a">PC1</text>
    <text x="130" y="455" font-size="13" font-weight="700" fill="#7c2d12">VLAN 100</text>
    <text x="330" y="437" font-size="15" font-weight="700" fill="#0f172a">PC2</text>
    <text x="330" y="455" font-size="13" font-weight="700" fill="#7c2d12">VLAN 100</text>
    <text x="660" y="437" font-size="15" font-weight="700" fill="#0f172a">PC3</text>
    <text x="660" y="455" font-size="13" font-weight="700" fill="#155e75">VLAN 200</text>
    <text x="860" y="437" font-size="15" font-weight="700" fill="#0f172a">PC4</text>
    <text x="860" y="455" font-size="13" font-weight="700" fill="#6b21a8">VLAN 300</text>
  </g>

  <text x="500" y="480" text-anchor="middle" font-size="13" fill="#475569">El tráfico entre VLANs distintas sube por el troncal, el router lo encamina entre subinterfaces y lo devuelve al switch.</text>
</svg>
