<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="520" rx="18" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Ruteo entre VLANs mediante subinterfaces</text>

  <!-- enlace troncal -->
  <line x1="450" y1="128" x2="450" y2="232" stroke="#b45309" stroke-width="4"/>
  <rect x="462" y="163" width="196" height="38" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="179" font-size="12.5" font-weight="700" fill="#92400e">Enlace troncal (tagged)</text>
  <text x="470" y="194" font-size="11.5" fill="#b45309">transporta VLAN 100, 200 y 300</text>

  <!-- enlaces de acceso -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="350" y1="288" x2="150" y2="398"/>
    <line x1="410" y1="288" x2="310" y2="398"/>
    <line x1="490" y1="288" x2="590" y2="398"/>
    <line x1="550" y1="288" x2="750" y2="398"/>
  </g>

  <!-- router -->
  <rect x="330" y="62" width="240" height="66" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Router</text>
  <text x="450" y="107" text-anchor="middle" font-size="11.5" fill="#1e40af">una interfaz física, tres subinterfaces</text>
  <text x="450" y="121" text-anchor="middle" font-size="11" fill="#1e40af">(router-on-a-stick)</text>

  <g font-size="12" fill="#1e3a8a">
    <rect x="596" y="52" width="196" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="606" y="72" font-weight="700">G0/0.100 — 10.100.0.1/24</text>
    <text x="606" y="92" font-weight="700">G0/0.200 — 10.200.0.1/24</text>
    <text x="606" y="112" font-weight="700">G0/0.300 — 10.300.0.1/24</text>
  </g>

  <!-- switch -->
  <rect x="320" y="234" width="260" height="54" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="450" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Switch con soporte VLAN</text>
  <text x="450" y="275" text-anchor="middle" font-size="11" fill="#166534">puertos de acceso (untagged) hacia las PCs</text>

  <!-- PCs -->
  <g>
    <rect x="96" y="398" width="108" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="150" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PC1</text>
    <text x="150" y="434" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">VLAN 100</text>

    <rect x="256" y="398" width="108" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="310" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PC2</text>
    <text x="310" y="434" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">VLAN 100</text>

    <rect x="536" y="398" width="108" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="590" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PC3</text>
    <text x="590" y="434" text-anchor="middle" font-size="11" font-weight="600" fill="#155e75">VLAN 200</text>

    <rect x="696" y="398" width="108" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="750" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PC4</text>
    <text x="750" y="434" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">VLAN 300</text>
  </g>

  <text x="450" y="486" text-anchor="middle" font-size="12" fill="#475569">El tráfico entre VLANs distintas sube por el troncal, el router lo encamina entre subinterfaces y lo devuelve al switch.</text>
</svg>
