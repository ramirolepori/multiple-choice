    <text x="624" y="159" text-anchor="end">eth0 .6</text>
    <text x="376" y="363">eth0 .18</text>
    <text x="624" y="363" text-anchor="end">eth0 .17</text>
    <text x="128" y="162">eth1 .9</text>
    <text x="128" y="327">eth1 .10</text>
    <text x="872" y="162" text-anchor="end">eth1 .13</text>
    <text x="872" y="327" text-anchor="end">eth1 .14</text>
  </g>

  <!-- routers -->
  <use href="#rt" x="292" y="120" width="76" height="41"/>
  <use href="#rt" x="632" y="120" width="76" height="41"/>
  <use href="#rt" x="632" y="320" width="76" height="41"/>
  <use href="#rt" x="292" y="320" width="76" height="41"/>

  <g text-anchor="middle">
    <text x="330" y="182" font-size="15" font-weight="700" fill="#1e3a8a">router1</text>
    <text x="330" y="198" font-size="12.5" fill="#1e40af">eth2 172.16.1.1</text>
    <text x="670" y="182" font-size="15" font-weight="700" fill="#1e3a8a">router2</text>
    <text x="670" y="198" font-size="12.5" fill="#1e40af">eth2 172.16.2.1</text>
    <text x="330" y="292" font-size="15" font-weight="700" fill="#1e3a8a">router4</text>
    <text x="330" y="308" font-size="12.5" fill="#1e40af">eth2 172.16.4.1</text>
    <text x="670" y="292" font-size="15" font-weight="700" fill="#1e3a8a">router3</text>
    <text x="670" y="308" font-size="12.5" fill="#1e40af">eth2 172.16.3.1</text>
  </g>

  <!-- PCs -->
  <use href="#pc" x="302" y="36" width="56" height="47"/>
  <use href="#pc" x="642" y="36" width="56" height="47"/>
  <use href="#pc" x="302" y="400" width="56" height="47"/>
  <use href="#pc" x="642" y="400" width="56" height="47"/>

  <g font-size="14">
    <text x="366" y="56" font-weight="700" fill="#0f172a">PC1</text>
    <text x="366" y="73" font-size="12.5" fill="#475569">172.16.1.0/24</text>
    <text x="706" y="56" font-weight="700" fill="#0f172a">PC2</text>
    <text x="706" y="73" font-size="12.5" fill="#475569">172.16.2.0/24</text>
    <text x="366" y="420" font-weight="700" fill="#0f172a">PC4</text>
    <text x="366" y="437" font-size="12.5" fill="#475569">172.16.4.0/24</text>
    <text x="706" y="420" font-weight="700" fill="#0f172a">PC3</text>
    <text x="706" y="437" font-size="12.5" fill="#475569">172.16.3.0/24</text>
