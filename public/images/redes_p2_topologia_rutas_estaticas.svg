<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <symbol id="rt" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="0 0 88 74">
      <rect x="5" y="5" width="78" height="52" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
      <rect x="13" y="13" width="62" height="36" rx="3" fill="#64748b"/>
      <path d="M35 57 h18 l4 9 h-26 z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="65" width="48" height="7" rx="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="500" rx="18" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Topología en anillo con rutas estáticas</text>

  <!-- enlaces de transito -->
  <g stroke="#334155" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <path d="M368 140 H632"/>
    <path d="M368 340 H632"/>
    <path d="M292 140 H120 V340 H292"/>
    <path d="M708 140 H880 V340 H708"/>
  </g>
  <!-- enlaces LAN -->
  <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 4">
    <line x1="330" y1="83" x2="330" y2="120"/>
    <line x1="670" y1="83" x2="670" y2="120"/>
    <line x1="330" y1="361" x2="330" y2="400"/>
    <line x1="670" y1="361" x2="670" y2="400"/>
  </g>

  <!-- etiquetas de enlaces -->
  <g font-size="15" font-weight="700" fill="#0f172a">
    <rect x="437" y="118" width="126" height="20" rx="6" fill="#ffffff"/>
    <text x="500" y="134" text-anchor="middle">10.10.10.4/30</text>
    <rect x="435" y="318" width="130" height="20" rx="6" fill="#ffffff"/>
    <text x="500" y="334" text-anchor="middle">10.10.10.16/30</text>
    <text x="112" y="245" text-anchor="end">10.10.10.8/30</text>
    <text x="888" y="245">10.10.10.12/30</text>
