<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <symbol id="rt" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
    <symbol id="rt-abr" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#e9d5ff" stroke="#7e22ce" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
      <g stroke="#7e22ce" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
    <symbol id="rt-asbr" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#fecdd3" stroke="#be123c" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#ffe4e6" stroke="#be123c" stroke-width="3"/>
      <g stroke="#be123c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="500" rx="18" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Jerarquía de áreas en OSPF</text>

  <!-- Sistema autonomo -->
  <rect x="40" y="52" width="770" height="330" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="76" font-size="14.5" font-weight="700" fill="#475569">Sistema Autónomo 500</text>

  <!-- areas -->
  <rect x="196" y="92" width="374" height="94" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="383" y="112" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">Área 0 — troncal (backbone)</text>

  <rect x="66" y="248" width="286" height="118" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="209" y="268" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14532d">Área 1</text>

  <rect x="450" y="248" width="286" height="118" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="593" y="268" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350f">Área 2</text>

  <!-- enlaces -->
  <g stroke="#334155" stroke-width="2.2" fill="none">
    <line x1="300" y1="152" x2="352" y2="152"/>
    <line x1="414" y1="152" x2="466" y2="152"/>
    <line x1="562" y1="152" x2="646" y2="152"/>
    <line x1="272" y1="168" x2="228" y2="296"/>
    <line x1="494" y1="168" x2="540" y2="296"/>
    <line x1="176" y1="312" x2="212" y2="312"/>
    <line x1="574" y1="312" x2="610" y2="312"/>
    <line x1="740" y1="140" x2="836" y2="140"/>
  </g>

  <!-- routers area 0 -->
  <use href="#rt" x="244" y="136" width="56" height="30"/>
  <text x="272" y="182" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">R1</text>
  <use href="#rt" x="355" y="136" width="56" height="30"/>
  <text x="383" y="182" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">R2</text>
  <use href="#rt" x="466" y="136" width="56" height="30"/>
  <text x="494" y="182" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">R3</text>

  <!-- ASBR -->
  <use href="#rt-asbr" x="646" y="125" width="60" height="32"/>
  <text x="676" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#881337">R8</text>
  <text x="676" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#be123c">ASBR</text>
  <text x="844" y="136" font-size="13.5" font-weight="700" fill="#475569">Hacia otro</text>
  <text x="844" y="154" font-size="13.5" font-weight="700" fill="#475569">Sistema Autónomo</text>

  <!-- area 1 -->
  <use href="#rt-abr" x="198" y="296" width="60" height="32"/>
  <text x="228" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#581c87">R4</text>
  <text x="228" y="361" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">ABR</text>
  <use href="#rt" x="120" y="297" width="56" height="30"/>
  <text x="148" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">R5</text>

  <!-- area 2 -->
  <use href="#rt-abr" x="510" y="296" width="60" height="32"/>
  <text x="540" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#581c87">R6</text>
  <text x="540" y="361" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">ABR</text>
  <use href="#rt" x="610" y="297" width="56" height="30"/>
  <text x="638" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">R7</text>

  <!-- referencias -->
  <rect x="40" y="400" width="920" height="84" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <g font-size="13.5" fill="#334155">
    <use href="#rt" x="62" y="416" width="44" height="24"/>
    <text x="118" y="434">Router troncal / interno: encamina dentro de su propia área</text>
    <use href="#rt-abr" x="62" y="452" width="44" height="24"/>
    <text x="118" y="470">ABR: conecta un área con la troncal y resume las redes de su área</text>
    <use href="#rt-asbr" x="556" y="452" width="44" height="24"/>
    <text x="612" y="470">ASBR: intercambia rutas con otro Sistema Autónomo</text>
  </g>
</svg>
