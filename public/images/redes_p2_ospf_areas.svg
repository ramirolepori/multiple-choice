<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="500" rx="18" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Jerarquía de áreas en OSPF</text>

  <!-- SA -->
  <rect x="40" y="52" width="700" height="330" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="76" font-size="13" font-weight="700" fill="#475569">Sistema Autónomo 500</text>

  <!-- area 0 -->
  <rect x="250" y="92" width="290" height="106" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="395" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Área 0 — troncal (backbone)</text>

  <!-- area 1 -->
  <rect x="72" y="232" width="240" height="126" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="192" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Área 1</text>

  <!-- area 2 -->
  <rect x="470" y="232" width="240" height="126" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="590" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Área 2</text>

  <!-- enlaces -->
  <g stroke="#334155" stroke-width="2">
    <line x1="322" y1="160" x2="368" y2="160"/>
    <line x1="422" y1="160" x2="468" y2="160"/>
    <line x1="310" y1="176" x2="192" y2="286"/>
    <line x1="480" y1="176" x2="590" y2="286"/>
    <line x1="152" y1="322" x2="232" y2="322"/>
    <line x1="550" y1="322" x2="630" y2="322"/>
    <line x1="540" y1="145" x2="700" y2="145"/>
  </g>

  <!-- routers area 0 -->
  <g>
    <circle cx="298" cy="160" r="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="298" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">R1</text>
    <circle cx="395" cy="160" r="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="395" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">R2</text>
    <circle cx="492" cy="160" r="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="492" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">R3</text>
  </g>

  <!-- ABR area1 -->
  <circle cx="192" cy="300" r="24" fill="#ffffff" stroke="#7e22ce" stroke-width="3"/>
  <text x="192" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">R4</text>
  <text x="192" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7e22ce">ABR</text>

  <!-- interno area1 -->
  <circle cx="128" cy="322" r="22" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="128" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">R5</text>

  <!-- ABR area2 -->
  <circle cx="590" cy="300" r="24" fill="#ffffff" stroke="#7e22ce" stroke-width="3"/>
  <text x="590" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">R6</text>
  <text x="590" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7e22ce">ABR</text>

  <circle cx="654" cy="322" r="22" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <text x="654" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">R7</text>

  <!-- ASBR -->
  <circle cx="722" cy="145" r="24" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
  <text x="722" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#881337">R8</text>
  <text x="722" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#be123c">ASBR</text>
  <text x="800" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">Hacia otro</text>
  <text x="800" y="136" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">Sistema Autónomo</text>

  <!-- referencias -->
  <g font-size="12.5" fill="#334155">
    <rect x="40" y="398" width="816" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="66" cy="422" r="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="84" y="426">Router troncal / interno: encamina dentro de su propia área</text>
    <circle cx="66" cy="452" r="9" fill="#ffffff" stroke="#7e22ce" stroke-width="3"/>
    <text x="84" y="456">ABR: conecta un área con la troncal y resume las redes de su área</text>
    <circle cx="520" cy="452" r="9" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
    <text x="538" y="456">ASBR: intercambia rutas con otro Sistema Autónomo</text>
  </g>
</svg>
