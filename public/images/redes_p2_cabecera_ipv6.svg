<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="500" rx="18" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Comparación de la cabecera IPv4 y la cabecera IPv6</text>

  <text x="228" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Cabecera IPv4</text>
  <text x="672" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Cabecera IPv6</text>

  <!-- IPv4 -->
  <g font-size="11.5">
    <rect x="48" y="74" width="120" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="108" y="97" text-anchor="middle" font-weight="700" fill="#1e3a8a">Versión</text>
    <rect x="168" y="74" width="80" height="36" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="208" y="97" text-anchor="middle" font-weight="700" fill="#7f1d1d">IHL</text>
    <rect x="248" y="74" width="160" height="36" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
    <text x="328" y="97" text-anchor="middle" font-weight="700" fill="#78350f">Tipo de servicio</text>

    <rect x="48" y="110" width="240" height="36" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="168" y="133" text-anchor="middle" font-weight="700" fill="#7f1d1d">Identificación</text>
    <rect x="288" y="110" width="120" height="36" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="348" y="133" text-anchor="middle" font-weight="700" fill="#7f1d1d">Flags + Offset</text>

    <rect x="48" y="146" width="120" height="36" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
    <text x="108" y="169" text-anchor="middle" font-weight="700" fill="#78350f">TTL</text>
    <rect x="168" y="146" width="120" height="36" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
    <text x="228" y="169" text-anchor="middle" font-weight="700" fill="#78350f">Protocolo</text>
    <rect x="288" y="146" width="120" height="36" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="348" y="169" text-anchor="middle" font-weight="700" fill="#7f1d1d">Checksum</text>

    <rect x="48" y="182" width="360" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="228" y="205" text-anchor="middle" font-weight="700" fill="#1e3a8a">Dirección de origen (32 bits)</text>
    <rect x="48" y="218" width="360" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="228" y="241" text-anchor="middle" font-weight="700" fill="#1e3a8a">Dirección de destino (32 bits)</text>

    <rect x="48" y="254" width="270" height="36" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="183" y="277" text-anchor="middle" font-weight="700" fill="#7f1d1d">Opciones</text>
    <rect x="318" y="254" width="90" height="36" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="363" y="277" text-anchor="middle" font-weight="700" fill="#7f1d1d">Relleno</text>
  </g>

  <!-- IPv6 -->
  <g font-size="11.5">
    <rect x="492" y="74" width="110" height="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="547" y="97" text-anchor="middle" font-weight="700" fill="#1e3a8a">Versión</text>
    <rect x="602" y="74" width="120" height="36" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
    <text x="662" y="97" text-anchor="middle" font-weight="700" fill="#78350f">Clase de tráfico</text>
    <rect x="722" y="74" width="130" height="36" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
    <text x="787" y="97" text-anchor="middle" font-weight="700" fill="#14532d">Etiqueta de flujo</text>

    <rect x="492" y="110" width="140" height="36" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
    <text x="562" y="133" text-anchor="middle" font-weight="700" fill="#78350f">Long. de carga útil</text>
    <rect x="632" y="110" width="120" height="36" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
    <text x="692" y="133" text-anchor="middle" font-weight="700" fill="#78350f">Next Header</text>
    <rect x="752" y="110" width="100" height="36" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
    <text x="802" y="133" text-anchor="middle" font-weight="700" fill="#78350f">Hop Limit</text>

    <rect x="492" y="146" width="360" height="54" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="672" y="178" text-anchor="middle" font-weight="700" fill="#1e3a8a">Dirección de origen (128 bits)</text>
    <rect x="492" y="200" width="360" height="54" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="672" y="232" text-anchor="middle" font-weight="700" fill="#1e3a8a">Dirección de destino (128 bits)</text>

    <rect x="492" y="254" width="360" height="36" fill="#e9d5ff" stroke="#7e22ce" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="672" y="277" text-anchor="middle" font-weight="700" fill="#581c87">Cabeceras de extensión (opcionales, encadenadas)</text>
  </g>

  <!-- referencias -->
  <g font-size="12.5">
    <rect x="48" y="324" width="804" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="68" y="342" width="20" height="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="98" y="355" fill="#334155">Campos que se mantienen en ambas versiones</text>
    <rect x="68" y="370" width="20" height="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="98" y="383" fill="#334155">Mismo propósito, pero con distinto nombre y posición en IPv6</text>
    <rect x="68" y="398" width="20" height="16" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="98" y="411" fill="#334155">Campos que NO existen en IPv6 (IHL, fragmentación, checksum, opciones)</text>
    <rect x="520" y="342" width="20" height="16" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="550" y="355" fill="#334155">Campo nuevo en IPv6</text>
    <rect x="520" y="370" width="20" height="16" fill="#e9d5ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="550" y="383" fill="#334155">Reemplazo de las opciones</text>
  </g>

  <text x="450" y="468" text-anchor="middle" font-size="12" fill="#475569">La cabecera IPv6 es de tamaño fijo (40 bytes), por eso no necesita el campo IHL.</text>
</svg>
