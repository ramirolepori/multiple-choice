<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="18" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Agente relay de DHCP</text>

  <!-- LANs -->
  <rect x="44" y="58" width="330" height="252" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="64" y="82" font-size="13" font-weight="700" fill="#64748b">LAN 2 — clientes</text>
  <rect x="526" y="58" width="330" height="252" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="546" y="82" font-size="13" font-weight="700" fill="#64748b">LAN 1 — servidores</text>

  <!-- router relay -->
  <rect x="382" y="150" width="136" height="76" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Router A</text>
  <text x="450" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">DHCP relay</text>
  <text x="450" y="212" text-anchor="middle" font-size="10" fill="#1e40af">completa relay agent IP</text>

  <g stroke="#334155" stroke-width="2.5">
    <line x1="222" y1="188" x2="382" y2="188"/>
    <line x1="518" y1="188" x2="678" y2="188"/>
  </g>

  <!-- cliente -->
  <rect x="102" y="160" width="120" height="56" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="162" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PC-D</text>
  <text x="162" y="200" text-anchor="middle" font-size="10.5" fill="#475569">sin dirección IP</text>

  <!-- servidor -->
  <rect x="678" y="160" width="130" height="56" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="743" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Servidor DHCP</text>
  <text x="743" y="200" text-anchor="middle" font-size="10.5" fill="#166534">varios rangos definidos</text>

  <!-- broadcast label -->
  <rect x="228" y="108" width="150" height="38" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="303" y="124" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">DHCP Discover</text>
  <text x="303" y="139" text-anchor="middle" font-size="10.5" fill="#b91c1c">broadcast · no cruza el router</text>

  <rect x="524" y="108" width="150" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="599" y="124" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Reenviado como</text>
  <text x="599" y="139" text-anchor="middle" font-size="10.5" fill="#166534">unicast al servidor</text>

  <!-- pasos -->
  <g font-size="12.5" fill="#334155">
    <rect x="44" y="330" width="812" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="66" y="354" font-weight="700" fill="#0f172a">Secuencia:</text>
    <text x="66" y="378">1. PC-D se inicia y envía un DHCP Discover como broadcast dentro de su LAN.</text>
    <text x="66" y="400">2. El router completa el campo «relay agent IP address» y envía la solicitud como unicast al servidor DHCP.</text>
    <text x="66" y="422">3. El servidor responde con el DHCP Offer al router, que se lo entrega al cliente.</text>
  </g>
</svg>
