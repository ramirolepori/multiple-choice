<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <symbol id="rt" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="0 0 88 74">
      <rect x="5" y="5" width="78" height="52" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
      <rect x="13" y="13" width="62" height="36" rx="3" fill="#64748b"/>
      <path d="M35 57 h18 l4 9 h-26 z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="65" width="48" height="7" rx="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
    </symbol>
    <symbol id="sv" viewBox="0 0 60 80">
      <rect x="6" y="4" width="48" height="72" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
      <rect x="14" y="14" width="32" height="9" rx="2.5" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
      <rect x="14" y="29" width="32" height="9" rx="2.5" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
      <rect x="14" y="44" width="32" height="9" rx="2.5" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
      <circle cx="19" cy="65" r="3.5" fill="#16a34a"/>
      <circle cx="30" cy="65" r="3.5" fill="#16a34a"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1000" height="480" rx="18" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Agente relay de DHCP</text>

  <!-- LANs -->
  <rect x="46" y="58" width="376" height="212" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="66" y="84" font-size="14.5" font-weight="700" fill="#64748b">LAN 2 — clientes</text>
  <rect x="578" y="58" width="376" height="212" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="598" y="84" font-size="14.5" font-weight="700" fill="#64748b">LAN 1 — servidores</text>

  <!-- enlaces -->
  <g stroke="#334155" stroke-width="2.5">
    <line x1="228" y1="160" x2="462" y2="160"/>
    <line x1="538" y1="160" x2="772" y2="160"/>
  </g>

  <!-- router relay -->
  <use href="#rt" x="462" y="140" width="76" height="41"/>
  <g text-anchor="middle">
    <text x="500" y="203" font-size="16" font-weight="700" fill="#1e3a8a">Router A</text>
    <text x="500" y="222" font-size="13" font-weight="700" fill="#b45309">DHCP relay</text>
    <text x="500" y="240" font-size="12" fill="#1e40af">completa «relay agent IP address»</text>
  </g>

  <!-- cliente -->
  <use href="#pc" x="172" y="137" width="56" height="47"/>
  <g text-anchor="middle">
    <text x="200" y="206" font-size="16" font-weight="700" fill="#0f172a">PC-D</text>
    <text x="200" y="225" font-size="12.5" fill="#475569">sin dirección IP</text>
  </g>

  <!-- servidor -->
  <use href="#sv" x="779" y="132" width="42" height="56"/>
  <g text-anchor="middle">
    <text x="800" y="210" font-size="16" font-weight="700" fill="#14532d">Servidor DHCP</text>
    <text x="800" y="229" font-size="12.5" fill="#166534">varios rangos definidos</text>
  </g>

  <!-- etiquetas de mensajes -->
  <rect x="248" y="104" width="196" height="42" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="346" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">DHCP Discover</text>
  <text x="346" y="139" text-anchor="middle" font-size="12" fill="#b91c1c">broadcast · no cruza el router</text>

  <rect x="562" y="104" width="196" height="42" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="660" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Reenviado como</text>
  <text x="660" y="139" text-anchor="middle" font-size="12" fill="#166534">unicast al servidor</text>

  <!-- pasos -->
  <rect x="46" y="300" width="908" height="136" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <g font-size="14" fill="#334155">
    <text x="70" y="328" font-size="15" font-weight="700" fill="#0f172a">Secuencia:</text>
    <text x="70" y="356">1. PC-D se inicia y envía un DHCP Discover como broadcast dentro de su LAN.</text>
    <text x="70" y="384">2. El router completa el campo «relay agent IP address» y envía la solicitud como unicast al servidor DHCP.</text>
    <text x="70" y="412">3. El servidor envía el DHCP Offer al router, que se lo entrega al cliente.</text>
  </g>

  <text x="500" y="462" text-anchor="middle" font-size="13" fill="#475569">El relay elimina la necesidad de tener un servidor DHCP en cada LAN.</text>
</svg>
