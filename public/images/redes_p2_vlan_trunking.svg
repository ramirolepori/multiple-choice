<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="18" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Segmentación con VLANs y enlace troncal entre edificios</text>

  <!-- edificios -->
  <rect x="52" y="66" width="360" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="72" y="90" font-size="13" font-weight="700" fill="#64748b">Edificio 1</text>
  <rect x="488" y="66" width="360" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="508" y="90" font-size="13" font-weight="700" fill="#64748b">Edificio 2</text>

  <!-- troncal -->
  <line x1="322" y1="180" x2="578" y2="180" stroke="#b45309" stroke-width="4"/>
  <rect x="352" y="130" width="196" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="147" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Enlace troncal (fibra óptica)</text>
  <text x="450" y="162" text-anchor="middle" font-size="11.5" fill="#b45309">transporta VLAN 10 y VLAN 20 etiquetadas</text>

  <!-- enlaces de acceso -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="192" y1="206" x2="150" y2="300"/>
    <line x1="272" y1="206" x2="318" y2="300"/>
    <line x1="628" y1="206" x2="586" y2="300"/>
    <line x1="708" y1="206" x2="754" y2="300"/>
  </g>

  <!-- switches -->
  <rect x="142" y="154" width="180" height="52" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="232" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Switch 1</text>
  <text x="232" y="194" text-anchor="middle" font-size="10.5" fill="#166534">con soporte de VLAN</text>

  <rect x="578" y="154" width="180" height="52" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="668" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Switch 2</text>
  <text x="668" y="194" text-anchor="middle" font-size="10.5" fill="#166534">con soporte de VLAN</text>

  <!-- PCs -->
  <g>
    <rect x="94" y="300" width="112" height="52" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="150" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Admin1</text>
    <text x="150" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">VLAN 10</text>

    <rect x="262" y="300" width="112" height="52" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <text x="318" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Ventas1</text>
    <text x="318" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#be185d">VLAN 20</text>

    <rect x="530" y="300" width="112" height="52" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="586" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Admin2</text>
    <text x="586" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">VLAN 10</text>

    <rect x="698" y="300" width="112" height="52" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <text x="754" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Ventas2</text>
    <text x="754" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#be185d">VLAN 20</text>
  </g>

  <text x="450" y="432" text-anchor="middle" font-size="12" fill="#475569">No hay ningún router en la topología: sólo dos switches unidos por un enlace troncal.</text>
</svg>
