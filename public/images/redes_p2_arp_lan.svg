<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="460" rx="18" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">ARP con origen y destino en LANs diferentes</text>

  <!-- LANs -->
  <rect x="44" y="58" width="356" height="286" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="64" y="82" font-size="13" font-weight="700" fill="#64748b">LAN 1 — 192.168.1.0/24</text>
  <rect x="500" y="58" width="356" height="286" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="520" y="82" font-size="13" font-weight="700" fill="#64748b">LAN 2 — 192.168.2.0/24</text>

  <!-- router -->
  <rect x="392" y="150" width="116" height="66" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="173" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">R1</text>
  <text x="450" y="190" text-anchor="middle" font-size="10.5" fill="#1e40af">Giga0 192.168.1.1</text>
  <text x="450" y="205" text-anchor="middle" font-size="10.5" fill="#1e40af">Giga1 192.168.2.1</text>

  <!-- enlaces -->
  <g stroke="#334155" stroke-width="2.5">
    <line x1="216" y1="183" x2="392" y2="183"/>
    <line x1="508" y1="183" x2="684" y2="183"/>
  </g>

  <!-- PC A -->
  <rect x="96" y="156" width="120" height="54" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="156" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PC-A</text>
  <text x="156" y="195" text-anchor="middle" font-size="10.5" fill="#475569">192.168.1.16 · MAC-A</text>

  <!-- PC E -->
  <rect x="684" y="156" width="120" height="54" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="744" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PC-E</text>
  <text x="744" y="195" text-anchor="middle" font-size="10.5" fill="#475569">192.168.2.9 · MAC-E</text>

  <!-- flecha del envio -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>
  <path d="M156 232 C 156 282, 744 282, 744 232" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <text x="450" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">PC-A quiere enviar datos a PC-E (192.168.2.9)</text>

  <!-- trama -->
  <g>
    <text x="60" y="378" font-size="13" font-weight="700" fill="#0f172a">Trama que PC-A pone en el cable:</text>
    <rect x="60" y="392" width="180" height="42" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
    <text x="150" y="409" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">MAC destino</text>
    <text x="150" y="425" text-anchor="middle" font-size="11" fill="#7f1d1d">MAC de Giga0 (R1)</text>

    <rect x="240" y="392" width="150" height="42" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
    <text x="315" y="409" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">MAC origen</text>
    <text x="315" y="425" text-anchor="middle" font-size="11" fill="#7f1d1d">MAC-A</text>

    <rect x="390" y="392" width="170" height="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="475" y="409" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">IP origen</text>
    <text x="475" y="425" text-anchor="middle" font-size="11" fill="#1e40af">192.168.1.16</text>

    <rect x="560" y="392" width="170" height="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="645" y="409" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">IP destino</text>
    <text x="645" y="425" text-anchor="middle" font-size="11" fill="#1e40af">192.168.2.9</text>

    <rect x="730" y="392" width="110" height="42" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
    <text x="785" y="418" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">DATOS</text>
  </g>

  <text x="450" y="358" text-anchor="middle" font-size="12" fill="#475569">Las direcciones IP son extremo a extremo; las MAC sólo tienen validez dentro de cada enlace.</text>
</svg>
