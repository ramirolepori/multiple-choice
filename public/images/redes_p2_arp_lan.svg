<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <symbol id="rt" viewBox="0 0 96 52">
      <path d="M4 20 v14 a44 12 0 0 0 88 0 V20 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="48" cy="20" rx="44" ry="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 15 H60"/><path d="M53 10 L60 15 L53 20"/>
        <path d="M64 26 H36"/><path d="M43 21 L36 26 L43 31"/>
      </g>
    </symbol>
    <symbol id="pc" viewBox="0 0 88 74">
      <rect x="5" y="5" width="78" height="52" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
      <rect x="13" y="13" width="62" height="36" rx="3" fill="#64748b"/>
      <path d="M35 57 h18 l4 9 h-26 z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="65" width="48" height="7" rx="3.5" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
    </symbol>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="18" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ARP con origen y destino en LANs diferentes</text>

  <!-- LANs -->
  <rect x="46" y="58" width="390" height="192" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="66" y="84" font-size="14.5" font-weight="700" fill="#64748b">LAN 1 — 192.168.1.0/24</text>
  <rect x="564" y="58" width="390" height="192" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="584" y="84" font-size="14.5" font-weight="700" fill="#64748b">LAN 2 — 192.168.2.0/24</text>

  <!-- enlaces -->
  <g stroke="#334155" stroke-width="2.5">
    <line x1="228" y1="150" x2="462" y2="150"/>
    <line x1="538" y1="150" x2="772" y2="150"/>
  </g>

  <!-- router -->
  <use href="#rt" x="462" y="130" width="76" height="41"/>
  <g text-anchor="middle">
    <text x="500" y="193" font-size="16" font-weight="700" fill="#1e3a8a">R1</text>
    <text x="500" y="212" font-size="12.5" fill="#1e40af">Giga0 192.168.1.1</text>
    <text x="500" y="229" font-size="12.5" fill="#1e40af">Giga1 192.168.2.1</text>
  </g>

  <!-- PCs -->
  <use href="#pc" x="172" y="127" width="56" height="47"/>
  <use href="#pc" x="772" y="127" width="56" height="47"/>
  <g text-anchor="middle">
    <text x="200" y="196" font-size="16" font-weight="700" fill="#0f172a">PC-A</text>
    <text x="200" y="215" font-size="12.5" fill="#475569">192.168.1.16 · MAC-A</text>
    <text x="800" y="196" font-size="16" font-weight="700" fill="#0f172a">PC-E</text>
    <text x="800" y="215" font-size="12.5" fill="#475569">192.168.2.9 · MAC-E</text>
  </g>

  <!-- flecha del envio -->
  <path d="M200 240 C 200 296, 800 296, 800 244" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <rect x="352" y="272" width="296" height="24" rx="7" fill="#ffffff"/>
  <text x="500" y="289" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">PC-A quiere enviar datos a PC-E (192.168.2.9)</text>

  <!-- trama -->
  <text x="60" y="342" font-size="15" font-weight="700" fill="#0f172a">Trama que PC-A pone en el cable de la LAN 1:</text>
  <g>
    <rect x="60" y="356" width="212" height="48" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="166" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">MAC destino</text>
    <text x="166" y="393" text-anchor="middle" font-size="12.5" fill="#7f1d1d">MAC de Giga0 (R1)</text>

    <rect x="272" y="356" width="176" height="48" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="360" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">MAC origen</text>
    <text x="360" y="393" text-anchor="middle" font-size="12.5" fill="#7f1d1d">MAC-A</text>

    <rect x="448" y="356" width="196" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="546" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">IP origen</text>
    <text x="546" y="393" text-anchor="middle" font-size="12.5" fill="#1e40af">192.168.1.16</text>

    <rect x="644" y="356" width="196" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="742" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">IP destino</text>
    <text x="742" y="393" text-anchor="middle" font-size="12.5" fill="#1e40af">192.168.2.9</text>

    <rect x="840" y="356" width="100" height="48" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="890" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">DATOS</text>
  </g>

  <text x="500" y="438" text-anchor="middle" font-size="13" fill="#475569">Las direcciones IP son extremo a extremo; las MAC sólo tienen validez dentro de cada enlace.</text>
</svg>
